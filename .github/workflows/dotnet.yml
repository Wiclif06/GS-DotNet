name: .NET checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore AgroConecta.sln
      - run: dotnet build AgroConecta.sln --no-restore --configuration Release
      - run: dotnet test AgroConecta.sln --no-build --configuration Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xunit-results
          path: TestResults/*.trx
